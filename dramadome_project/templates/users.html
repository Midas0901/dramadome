<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users - DramaDome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="nav-links"><a href="/">&larr; Back to home</a></div>
        <h1>Users (first 50 shown)</h1>
        <table>
            <tr>
                <th>User ID</th>
                <th>Gender</th>
                <th>Location</th>
                <th>Preferred genre</th>
                <th>Preferred country</th>
            </tr>
            {% for u in users %}
            <tr>
                <td><a class="plain" href="/user/{{ u.user_id }}">{{ u.user_id }}</a></td>
                <td>{{ u.gender }}</td>
                <td>{{ u.location }}</td>
                <td>{{ u.preferred_genre }}</td>
                <td>{{ u.preferred_country }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
